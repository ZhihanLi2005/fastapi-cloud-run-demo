<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <title>API 测试页面</title>
</head>

<body>
    <h1>用户接口测试页面</h1>
    <h2>用户登录</h2>

    <label>邮箱：</label>
    <input type="email" id="email">

    <br><br>

    <label>密码：</label>
    <input type="password" id="password">

    <br><br>

    <button onclick="login()">登录</button>
    <button onclick="logout()">退出登录</button>
    <p id="result">等待登录……</p >

    <hr>

    <h2>获取当前用户</h2>
    <button onclick="getCurrentUser()">获取当前用户</button>
    <p id="userResult">尚未获取</p>

    <hr>

    <h2>修改用户</h2>
    <label>新用户名：</label>
    <input type="text" id="updateName">

    <br><br>

    <label>新邮箱：</label>
    <input type="email" id="updateEmail">

    <br><br>

    <button onclick="updateUser()">修改用户</button>
    <p id="updateResult">尚未修改</p>

    <hr>

    <h2>删除用户</h2>
    <button onclick="deleteUser()">删除当前用户</button>
    <p id="deleteResult">尚未删除</p>

    <script>
        async function login() {
            const email = document.getElementById("email").value;
            const password = document.getElementById("password").value;
            const resultEl = document.getElementById("result");

            resultEl.innerText = "请求中……";

            try {
                const response = await fetch("http://127.0.0.1:8000/login", {
                    method: "POST",
                    headers: {
                        "Content-Type": "application/json"
                    },
                    body: JSON.stringify({
                        email: email,
                        password: password
                    })
                });

                const data = await response.json();

                if (response.ok) {
                    localStorage.setItem("access_token", data.access_token);
                    resultEl.innerText = "登录成功，Token 已保存！";
                } else {
                    resultEl.innerText = "登录失败：" + JSON.stringify(data);
                }
            } catch (err) {
                // fetch 在网络错误 / CORS 被拦截 / 后端没启动时会直接抛异常，
                // 之前这里没有 try/catch，所以页面上什么反应都没有，
                // 只有浏览器控制台会看到红色报错。现在把错误也显示在页面上。
                console.error("请求失败：", err);
                resultEl.innerText =
                    "请求失败，请检查：1) 后端是否已启动 2) 后端是否配置了 CORS。错误详情：" + err.message;
            }
        }

        function logout() {
            // 后端没有单独的 /logout 接口（用的是无状态 JWT，服务端不记录会话），
            // 退出登录在前端做就够了：把本地保存的 token 删掉，
            // 这样后面所有需要认证的请求都会因为拿不到 token 而被挡住。
            localStorage.removeItem("access_token");
            document.getElementById("result").innerText = "已退出登录，Token 已清除。";
            document.getElementById("userResult").innerText = "尚未获取";
            document.getElementById("updateResult").innerText = "尚未修改";
            document.getElementById("deleteResult").innerText = "尚未删除";
        }

        function getToken(displayEl) {
            const token = localStorage.getItem("access_token");
            if (!token) {
                displayEl.innerText = "还没有 Token，请先登录。";
                return null;
            }
            return token;
        }

        async function getCurrentUser() {
            const userResultEl = document.getElementById("userResult");
            const token = getToken(userResultEl);
            if (!token) return;

            userResultEl.innerText = "请求中……";

            try {
                const response = await fetch("http://127.0.0.1:8000/users/me", {
                    method: "GET",
                    headers: {
                        "Authorization": "Bearer " + token
                    }
                });

                const data = await response.json();

                if (response.ok) {
                    userResultEl.innerText =
                        `id: ${data.id}\nname: ${data.name}\nemail: ${data.email}`;
                } else {
                    // 常见情况：token 过期/无效会返回 401
                    userResultEl.innerText = "获取失败：" + JSON.stringify(data);
                }
            } catch (err) {
                console.error("请求失败：", err);
                userResultEl.innerText =
                    "请求失败，请检查后端是否启动 / CORS 是否配置。错误详情：" + err.message;
            }
        }

        async function updateUser() {
            const updateResultEl = document.getElementById("updateResult");
            const token = getToken(updateResultEl);
            if (!token) return;

            const name = document.getElementById("updateName").value;
            const email = document.getElementById("updateEmail").value;

            updateResultEl.innerText = "请求中……";

            try {
                const response = await fetch("http://127.0.0.1:8000/users/me", {
                    method: "PUT",
                    headers: {
                        "Content-Type": "application/json",
                        "Authorization": "Bearer " + token
                    },
                    body: JSON.stringify({
                        name: name,
                        email: email
                    })
                });

                const data = await response.json();

                if (response.ok) {
                    updateResultEl.innerText = "修改成功：" + JSON.stringify(data);
                } else {
                    updateResultEl.innerText = "修改失败：" + JSON.stringify(data);
                }
            } catch (err) {
                console.error("请求失败：", err);
                updateResultEl.innerText =
                    "请求失败，请检查后端是否启动 / CORS 是否配置。错误详情：" + err.message;
            }
        }

        async function deleteUser() {
            const deleteResultEl = document.getElementById("deleteResult");
            const token = getToken(deleteResultEl);
            if (!token) return;

            if (!confirm("确定要删除当前登录的用户吗？这个操作不可恢复。")) {
                return;
            }

            deleteResultEl.innerText = "请求中……";

            try {
                const response = await fetch("http://127.0.0.1:8000/users/me", {
                    method: "DELETE",
                    headers: {
                        "Authorization": "Bearer " + token
                    }
                });

                const data = await response.json();

                if (response.ok) {
                    deleteResultEl.innerText = "删除成功：" + JSON.stringify(data);
                    // 用户已经被删了，本地 token 也没意义了，一并清掉
                    localStorage.removeItem("access_token");
                } else {
                    deleteResultEl.innerText = "删除失败：" + JSON.stringify(data);
                }
            } catch (err) {
                console.error("请求失败：", err);
                deleteResultEl.innerText =
                    "请求失败，请检查后端是否启动 / CORS 是否配置。错误详情：" + err.message;
            }
        }
        </script>
</body>
</html>
